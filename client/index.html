<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drift Property Services</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Applied before paint so the theme is right on first frame, not after
      // React hydrates and a flash of the other theme has already happened.
      (function () {
        try {
          var stored = localStorage.getItem('avcrm.theme');
          if (stored === 'light') document.documentElement.dataset.theme = 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
