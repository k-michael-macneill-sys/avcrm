    <style>
      /*
       * Self-contained on purpose: this page sits outside the SPA (no
       * account, no session, nothing to click) and must not depend on
       * whatever the app's own stylesheet happens to be this month.
       */
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: #0b0f19;
        color: #f1f5f9;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 16px;
        padding: 28px;
      }
      .brand {
        height: 32px;
        width: auto;
        border-radius: 6px;
        margin: 0 0 12px;
        display: block;
      }
      h1 {
        font-size: 22px;
        margin: 4px 0 16px;
      }
      p {
        margin: 0;
      }
      .secondary {
        color: #cbd5e1;
        margin-top: 12px;
      }
      .muted {
        color: #94a3b8;
        font-size: 12px;
        margin-top: 16px;
      }
    </style>
